name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mail-importer dependencies
        run: pip install -r mail-importer/requirements-dev.txt

      - name: Python syntax check
        run: python -m py_compile mail-importer/mailimporter/*.py

      - name: Python unit tests
        run: python -m pytest -q
        working-directory: mail-importer

      - name: Shell syntax check (bridge entrypoint)
        run: sh -n bridge/entrypoint.sh

      - name: Shell syntax check (obsidian init script)
        run: bash -n obsidian/custom-cont-init.d/50-install-local-rest-api

      - name: Validate docker-compose.yml
        run: |
          # mail-importer has env_file: .env — compose requires the file to
          # exist just to parse/validate the config. .env is never
          # committed; this is just an empty placeholder for CI.
          touch .env
          docker compose config --quiet
        env:
          # Only to satisfy the OBSIDIAN_WEB_PASSWORD:? requirement.
          OBSIDIAN_WEB_PASSWORD: ci-placeholder

  # Builds all three images (obsidian, bridge, mail-importer) on every run
  # so a broken Dockerfile fails a PR. Only pushes to GHCR once `verify`
  # has passed:
  #   - push to main   -> :main  and  :sha-<short>   (bleeding edge, for testing)
  #   - tag vX.Y.Z      -> :X.Y.Z  :X.Y  :X  :latest  (a real release)
  #   - pull request     -> build only, nothing pushed
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: obsidian
            context: ./obsidian
          - name: bridge
            context: ./bridge
          - name: mail-importer
            context: ./mail-importer
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          # `latest` is only set automatically on the newest semver tag
          # (metadata-action's default: latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build and push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Only builds linux/amd64 (most NAS Docker hosts, including the
          # TerraMaster F4-424 Pro). Add platforms: linux/amd64,linux/arm64
          # (requires docker/setup-qemu-action) to also serve ARM NAS units.
