name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create release PR / tag
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Use a PAT (secret RELEASE_PLEASE_TOKEN) if present so the release
          # PR is authored by a real user and CI runs on it automatically.
          # Otherwise falls back to GITHUB_TOKEN, whose PRs require a manual
          # "Approve and run".
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

    # When a release tag is cut (vX.Y.Z), the `images` job in ci.yml picks
    # it up via its `tags: ["v*"]` trigger and publishes versioned images
    # for obsidian, bridge, and mail-importer.
