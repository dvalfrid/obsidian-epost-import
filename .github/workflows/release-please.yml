name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Create release PR / tag
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Använd ett PAT (secret RELEASE_PLEASE_TOKEN) om det finns så att
          # release-PR:n skapas av en riktig användare och CI körs på den
          # automatiskt. Faller annars tillbaka på GITHUB_TOKEN, vars PR:ar
          # kräver manuellt "Approve and run".
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

    # När en release-tagg klipps (vX.Y.Z) plockar `images`-jobbet i ci.yml
    # upp den via sin `tags: ["v*"]`-trigger och publicerar versionerade
    # images för obsidian, bridge och mail-importer.
